<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · Gutscheine einlösen</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF9F1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=9">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="lotus" viewBox="0 0 120 80">
      <path d="M60 4c9 10 13 22 13 32S68 56 60 64c-8-8-13-18-13-28S51 14 60 4z"/>
      <path d="M17 18c14 2 26 10 33 26-7 3-16 2-24-4-6-5-9-13-9-22z"/>
      <path d="M103 18c-14 2-26 10-33 26 7 3 16 2 24-4 6-5 9-13 9-22z"/>
      <path d="M2 64c12-10 30-14 52-4-12 12-30 14-52 4z"/>
      <path d="M118 64c-12-10-30-14-52-4 12 12 30 14 52 4z"/>
    </symbol>
  </svg>

  <header class="topbar">
    <a href="/" class="brand">
      <svg class="lotus lotus--sm" viewBox="0 0 120 80"><use href="#lotus"/></svg>
      <span>Tibetan<br><small>Energy Balance Massage</small></span>
    </a>
  </header>

  <main class="narrow">
    <div class="page-head">
      <p class="eyebrow">Intern</p>
      <h1>Gutscheine einlösen</h1>
    </div>

    <!-- Login -->
    <form class="form" id="loginForm" hidden>
      <div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required></div>
      <p class="error" id="loginErr" role="alert" hidden></p>
      <button class="btn btn--primary" type="submit">Anmelden</button>
    </form>

    <!-- Einlösen -->
    <div id="app" hidden>
      <form class="form" id="lookupForm" style="padding-bottom:0">
        <div class="field">
          <label for="code">Gutscheincode</label>
          <div class="row">
            <input id="code" placeholder="BZ-XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
            <button class="btn btn--primary" type="submit" style="flex:none">Prüfen</button>
          </div>
        </div>
        <p class="error" id="lookupErr" role="alert" hidden></p>
      </form>

      <section class="section" id="result" hidden style="padding-top:20px">
        <div class="card" style="padding:20px;display:grid;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <strong class="mono" id="rCode"></strong><span class="status" id="rStatus"></span>
          </div>
          <dl class="kv">
            <dt>Gutschein</dt><dd id="rTitle"></dd>
            <dt>Wert</dt><dd id="rAmount"></dd>
            <dt>Restwert</dt><dd id="rRemaining" style="font-weight:500"></dd>
            <dt>Für</dt><dd id="rFor"></dd>
            <dt>Gekauft von</dt><dd id="rBuyer"></dd>
            <dt>Gekauft am</dt><dd id="rDate"></dd>
          </dl>
          <ul class="list" id="rHistory"></ul>
          <form id="redeemForm" style="display:grid;gap:10px">
            <div class="field" id="partialField">
              <label for="redeemEuro">Betrag einlösen (€)</label>
              <input id="redeemEuro" type="number" inputmode="decimal" min="1" step="0.01">
            </div>
            <div class="field"><label for="note">Notiz (optional)</label><input id="note" maxlength="200"></div>
            <p class="error" id="redeemErr" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit" id="redeemBtn">Einlösen</button>
          </form>
        </div>
      </section>

      <section class="section">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">Letzte Verkäufe</h2>
          <button class="btn btn--ghost btn--sm" id="logout" type="button">Abmelden</button>
        </div>
        <ul class="list" id="recent" style="margin-top:14px"></ul>
      </section>
    </div>
  </main>
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-functions-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/admin.js?v=9" defer></script>
</body>
</html>
